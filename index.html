<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainy Mountain Adventure V2</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="eyebrow">Read · Explore · Connect</span><h1>Rainy Mountain Adventure</h1></div>
    <div class="toolbar">
      <button id="home" type="button">Home</button>
      <button id="map-return" type="button">Return to Map</button>
      <button id="sound" type="button" aria-pressed="false">Sound: off</button>
      <button id="fullscreen" type="button">Fullscreen</button>
      <label class="teacher-toggle"><input id="teacher" type="checkbox"> Teacher access</label>
    </div>
    <nav aria-label="Adventure stages">
      <button type="button" data-stage="0">1 · Unlock the Landscape</button>
      <button type="button" data-stage="1">2 · History and Memory</button>
      <button type="button" data-stage="2">3 · Cultural Roots</button>
    </nav>
    <p id="mode-note" class="small"></p>
  </header>
  <main id="adventure" tabindex="-1"></main>
  <footer>
    <button id="previous" type="button">← Previous stage</button>
    <p id="progress" aria-live="polite">Adventure home</p>
    <button id="next" type="button">Next stage →</button>
    <button id="restart" type="button">Restart</button>
  </footer>
  <p id="announcement" class="announcement" role="status" aria-live="polite"></p>
  <dialog id="restart-dialog" aria-labelledby="restart-title">
    <h2 id="restart-title">Restart this journey?</h2>
    <p>This clears answers, clues, keys, and reflections for the current student journey or teacher rehearsal.</p>
    <button id="cancel-restart" type="button">Keep exploring</button>
    <button id="confirm-restart" type="button">Restart journey</button>
  </dialog>
  <noscript><p class="panel">Enable JavaScript to explore this offline adventure.</p></noscript>
</body>
</html>
